name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          CI: 'true'
      - run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: 'true'
      - run: npm ci
        working-directory: functions
      - run: node --test test/*.test.js
        working-directory: functions
