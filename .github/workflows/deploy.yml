name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          CI: 'true'
      - run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: 'true'
      - run: node --test test/*.test.js
        working-directory: worker
      - run: node --test test/*.test.js
        working-directory: gestao-worker
      - run: npm ci
        working-directory: gestao
      - run: npm test
        working-directory: gestao
      - run: npm run build
        working-directory: gestao
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: rules-test
      - run: npx --yes firebase-tools@13.29.1 emulators:exec --only firestore --project demo-bohtreinar "cd rules-test && node --test firestore.rules.test.js && node --test academy.rules.test.js"
