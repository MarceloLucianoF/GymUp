<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BohTreinar</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0F19; color: #E5E7EB; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .logo { width: 72px; height: 72px; border-radius: 16px; background: #FFC21A; display: grid; place-items: center; margin: 0 auto 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; color: #fff; }
  p { margin: 0 0 20px; color: #9CA3AF; font-size: 15px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 14px; background: #FFC21A; color: #121418; font-weight: 800; font-size: 16px; }
</style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 100 100"><g fill="none" stroke="#121418" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><polyline points="28,46 50,24 72,46"/><polyline points="28,64 50,42 72,64" stroke-opacity="0.6"/><polyline points="28,82 50,60 72,82" stroke-opacity="0.3"/></g></svg>
    </div>
    <h1>Sem conexão</h1>
    <p>O BohTreinar precisa de internet para abrir pela primeira vez. Depois, o que você já abriu fica disponível offline.</p>
    <button type="button" onclick="location.href='https://bohtreinar.marcelo-labs.workers.dev/'">Tentar de novo</button>
  </main>
</body>
</html>
